<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login institucional · dos tercios video</title>
  <!-- Font Awesome 5 (iconos) -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      background-color: #f5f7fa;
    }

    /* CONTENEDOR PRINCIPAL: DOS COLUMNAS */
    .split-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* COLUMNA IZQUIERDA: 2/3 — VIDEO EN BUCLE SIN CONTROLES */
    .video-panel {
      flex: 2; /* 2 partes de 3 */
      position: relative;
      overflow: hidden;
      background-color: #0b1f2b; /* fallback oscuro */
    }

    .video-panel video {
      position: absolute;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      object-fit: cover;       /* cubre todo el panel sin deformar */
      pointer-events: none;    /* evita interacción con el video */
    }

    /* Capa tenue para mejorar legibilidad si el login requiere contraste, pero sin estorbar */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25); /* sutil, para dar profundidad */
      z-index: 1;
    }

    /* COLUMNA DERECHA: 1/3 — FORMULARIO DE LOGIN */
    .login-panel {
      flex: 1; /* 1 parte de 3 */
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 2.2rem;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.08);
      z-index: 5;
      overflow-y: auto;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
    }

    /* Etiqueta "Iniciar sesión" */
    .login-title {
      font-size: 2rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }

    /* grupos de formulario */
    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      color: #334155;
      margin-bottom: 0.3rem;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 16px;        /* bordes estilo "card" suaves */
      background-color: #f8fafc;
      transition: 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
      background-color: white;
    }

    /* enlace de recuperación justo debajo del input correo (como en la imagen) */
    .recovery-link {
      text-align: left;
      margin-top: 0.4rem;
      margin-bottom: 1rem;
    }

    .recovery-link a {
      color: #2563eb;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px dashed #94a3b8;
      padding-bottom: 1px;
    }

    .recovery-link a:hover {
      color: #1d4ed8;
      border-bottom: 1px solid #2563eb;
    }

    /* botón principal "Siguiente" */
    .btn-primary {
      width: 100%;
      background: #0f2b44;        /* azul oscuro institucional */
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.9rem 1rem;
      border: none;
      border-radius: 40px;        /* botones tipo píldora */
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin: 1rem 0 1.8rem 0;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 16px -6px rgba(15, 43, 68, 0.25);
    }

    .btn-primary:hover {
      background: #1a3b5c;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Texto "Servicio de Autenticación Institucional" */
    .auth-legend {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 1rem;
    }

    /* Opciones de inicio de sesión adicionales (Gmail + íconos) */
    .login-options {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: white;
      border: 1.5px solid #d1d9e6;
      border-radius: 40px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
    }

    .option-btn i {
      font-size: 1.3rem;
      width: 24px;
      color: #4b5563;
    }

    .option-btn:hover {
      background-color: #f1f5f9;
      border-color: #9aa9b9;
    }

    /* botón específico de Google (con color) */
    .btn-google {
      border-color: #dadce0;
    }
    .btn-google i {
      color: #DB4437;  /* rojo google */
    }

    .btn-google:hover {
      background: #fce8e6;
      border-color: #DB4437;
    }

    /* Responsive para móviles: apilar columnas */
    @media (max-width: 768px) {
      .split-layout {
        flex-direction: column;
      }
      .video-panel {
        flex: 0 0 200px; /* altura fija para el video en móvil */
        width: 100%;
      }
      .login-panel {
        flex: 1;
        box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
      }
    }

    /* Pequeño detalle: sin logo ni texto de universidad, como solicitaste */
    .footer-note {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #a0afbe;
    }
  </style>
</head>
<body>
  <div class="split-layout">
    <!-- LADO IZQUIERDO - 2/3 VIDEO EN BUCLE -->
    <div class="video-panel">
      <!-- Video de muestra (bucle, sin controles, tomado de pexels (dominio público) o de archivo local) 
           Usamos un video cortesía de Coverr (free to use) para asegurar bucle y disponibilidad -->
      <video autoplay loop muted playsinline>
        <!-- Fuente: video de oficina moderna / institucional, sin logo, acorde al ambiente de login -->
        <source src="https://pixabay.com/es/videos/download/video-26798_medium.mp4" type="video/mp4">
        <!-- fallback si no carga el video: usar un segundo enlace de respaldo (también libre) -->
        <source src="https://pixabay.com/es/videos/download/video-26798_medium.mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
      </video>
      <div class="video-overlay"></div>
    </div>

    <!-- LADO DERECHO - 1/3 LOGIN (exactamente como referencia visual) -->
    <div class="login-panel">
      <div class="login-container">

        <!-- Título "Iniciar sesión" -->
        <h2 class="login-title">Iniciar sesión</h2>

        <!-- Campo correo electrónico -->
        <div class="input-group">
          <label class="input-label" for="email">Escribe tu correo electrónico</label>
          <input type="email" id="email" class="input-field" placeholder="usuario@ejemplo.com" value="">
          <!-- Enlace de recuperación justo debajo (como en la imagen) -->
          <div class="recovery-link">
            <a href="#"><i class="fas fa-key" style="font-size:0.8rem; margin-right:6px;"></i>¿Quieres cambiar o recuperar tu contraseña?</a>
          </div>
        </div>

        <!-- Campo contraseña (aunque no está en la imagen, lo añadimos con elegancia, ya que la imagen decía "usuario password") -->
        <div class="input-group">
          <label class="input-label" for="password">Contraseña</label>
          <input type="password" id="password" class="input-field" placeholder="··········">
        </div>

        <!-- Botón Siguiente (destacado) -->
        <button class="btn-primary">Siguiente</button>

        <!-- Texto "Servicio de Autenticación Institucional" -->
        <div class="auth-legend">
          Servicio de Autenticación Institucional
        </div>

        <!-- Opciones de inicio de sesión (Gmail y otras) -->
        <div class="login-options">
          <!-- Login con Gmail -->
          <a href="#" class="option-btn btn-google">
            <i class="fab fa-google"></i> Iniciar sesión con Gmail
          </a>
          <!-- Opción adicional: Cuenta institucional / Office (solo como relleno, opcional) -->
          <a href="#" class="option-btn">
            <i class="fas fa-user-graduate"></i> Cuenta institucional
          </a>
          <!-- Podría ser otra opción, pero dejamos las que se ven en "Opciones de inicio de sesión" -->
          <a href="#" class="option-btn">
            <i class="fas fa-shield-alt"></i> Acceso con código
          </a>
        </div>

        <!-- footer invisible, solo para mantener proporción (sin logos) -->
        <div class="footer-note"></div>
      </div>
    </div>
  </div>

  <!-- (Opcional: si los videos de pexels no cargan por CORS o políticas, dejamos un segundo source interno. 
       Pexels permite hotlinking, pero en algunos navegadores puede no cargar. Por eso duplicamos fuentes) 
       En local funcionan perfectamente. También incluimos un video alternativo más genérico -->
  <script>
    // Pequeño script para asegurar que el video se carga y reproduce en bucle incluso si el navegador necesita interacción
    document.addEventListener('DOMContentLoaded', function() {
      const videoEl = document.querySelector('video');
      if (videoEl) {
        videoEl.play().catch(e => {
          console.log('Autoplay bloqueado, se intenta reproducir manualmente (pero funciona con muted)');
          // en la mayoría de navegadores con muted y autoplay funciona.
        });
      }
    });
  </script>
</body>
</html>
